[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-wipe-account"
version = "0.1.0"
description = "Resumable Telegram account message cleaner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["telethon>=1.45,<2", "python-dotenv>=1.0", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
telegram-cleaner = "telegram_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
